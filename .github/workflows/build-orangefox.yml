name: OrangeFox Recovery (OFRP) CI/CD

on:
  push:
    paths:
      - '.github/workflows/build-orangefox.yml'
  workflow_dispatch:
    inputs:
      TARGET_DEVICE:
        type: choice
        description: "Target SM8550 Device"
        required: true
        default: oneplus_ace2_pro
        options:
          - oneplus_ace2_pro
          - realme_gt5
          - oneplus_11
      OF_BRANCH:
        type: choice
        description: "OrangeFox Manifest Branch"
        required: true
        default: "12.1"
        options:
          - "12.1"
          - "14.1"
          - "16.0"
      BUILD_KERNELSU:
        type: boolean
        description: "Integrate KernelSU / Next Addon in OrangeFox"
        required: true
        default: true

jobs:
  build:
    name: "Build OrangeFox for ${{ github.event.inputs.TARGET_DEVICE || 'oneplus_ace2_pro' }}"
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.TARGET_DEVICE || 'oneplus_ace2_pro' }}
      OF_BRANCH: ${{ github.event.inputs.OF_BRANCH || '12.1' }}
      BUILD_KERNELSU: ${{ github.event.inputs.BUILD_KERNELSU || 'true' }}
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_MAXSIZE: 15G
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          echo "Maximizing root and mount disk space aggressively for OrangeFox build..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -a -f --volumes || true
          
          # Setup 12GB swap on /mnt SSD
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          # Prepare /mnt workspace for huge tree sync
          sudo mkdir -p /mnt/ofox_workspace
          sudo chown -R runner:runner /mnt/ofox_workspace
          ln -sf /mnt/ofox_workspace ${{ github.workspace }}/ofox_workspace
          
          echo "Disk space after cleanup:"
          df -h

      - name: Install Build Dependencies
        run: |
          # Configure resilient DNS fallbacks to prevent intermittent cloud resolution issues
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf

          sudo apt-get clean
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "Retrying apt-get update ($i)..."; sleep 5; }
          done

          for i in 1 2 3 4 5; do
            sudo apt-get install -y --fix-missing --no-install-recommends \
              build-essential bc bison flex libssl-dev libelf-dev \
              git ccache zip unzip curl wget python3 python-is-python3 \
              libarchive-tools zstd jq openjdk-11-jdk rsync lzop \
              libncurses5 libncurses5-dev libxml2 libxml2-utils \
              squashfs-tools xsltproc patch && break || { echo "Retrying apt-get install ($i)..."; sleep 10; }
          done

          # Setup Android Repo tool
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Setup Ccache Environment
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ofox-${{ runner.os }}-${{ env.DEVICE }}-${{ env.OF_BRANCH }}
          restore-keys: |
            ccache-ofox-${{ runner.os }}-${{ env.DEVICE }}-
            ccache-ofox-${{ runner.os }}-

      - name: Sync OrangeFox Recovery Tree
        run: |
          git config --global user.name "buguj23"
          git config --global user.email "buguj23@gmail.com"
          git config --global --add safe.directory "*"

          echo "Cloning OrangeFox official sync tool..."
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git sync-tools
          chmod a+x sync-tools/orangefox_sync.sh

          BRANCH_NUM=$(echo "${{ env.OF_BRANCH }}" | sed 's/^fox_//')
          echo "Initializing and syncing OrangeFox recovery tree (branch $BRANCH_NUM)..."
          cd sync-tools
          ./orangefox_sync.sh --branch "$BRANCH_NUM" --path "/mnt/ofox_workspace"

          cd /mnt/ofox_workspace
          if [ ! -d bootable/recovery/gui/theme ]; then
            echo "Fetching OrangeFox recovery GUI theme..."
            git clone https://gitlab.com/OrangeFox/misc/theme.git bootable/recovery/gui/theme || true
          fi
          if [ ! -d external/nano ]; then
            echo "Fetching external nano dependency..."
            git clone --depth=1 https://github.com/LineageOS/android_external_nano -b lineage-19.1 external/nano || true
          fi
          if [ ! -d external/bash ]; then
            echo "Fetching external bash dependency..."
            git clone --depth=1 https://github.com/LineageOS/android_external_bash -b lineage-19.1 external/bash || true
          fi

      - name: Setup SM8550 Device Trees
        run: |
          cd ofox_workspace
          echo "Cloning OnePlus SM8550 recovery device trees..."
          git clone --depth=1 https://github.com/Wishmasterflo/ofox_salami.git device/oneplus/salami
          git clone --depth=1 https://github.com/sunmughan/android_device_oneplus_sm85xx-common.git device/oneplus/sm85xx-common

          # Adapt vendorsetup.sh for target device compatibility
          VSETUP="device/oneplus/salami/vendorsetup.sh"
          if [ -f "$VSETUP" ]; then
            if [ "${{ env.DEVICE }}" = "oneplus_ace2_pro" ]; then
              echo "Customizing OrangeFox for OnePlus Ace 2 Pro (corot / PJA110)..."
              sed -i 's/export FOX_BUILD_DEVICE=.*/export FOX_BUILD_DEVICE="OnePlus Ace 2 Pro"/' "$VSETUP"
              sed -i 's/export FOX_TARGET_DEVICES=.*/export FOX_TARGET_DEVICES="corot, Corot, PJA110, Ace2Pro, OnePlusAce2Pro, xigua, Xigua, salami, Salami, OnePlus11"/' "$VSETUP"
              sed -i 's/export TARGET_DEVICE_ALT=.*/export TARGET_DEVICE_ALT="corot, Corot, PJA110, Ace2Pro, OnePlusAce2Pro, xigua, Xigua, salami, Salami, OnePlus11"/' "$VSETUP"
              sed -i 's/export OF_SCREEN_H=.*/export OF_SCREEN_H=2772/' "$VSETUP"
            elif [ "${{ env.DEVICE }}" = "realme_gt5" ]; then
              echo "Customizing OrangeFox for Realme GT5 (ossi / RMX3820)..."
              sed -i 's/export FOX_BUILD_DEVICE=.*/export FOX_BUILD_DEVICE="Realme GT5"/' "$VSETUP"
              sed -i 's/export FOX_TARGET_DEVICES=.*/export FOX_TARGET_DEVICES="ossi, Ossi, RealmeGT5, RMX3820, RE5C33, salami, Salami, OnePlus11"/' "$VSETUP"
              sed -i 's/export TARGET_DEVICE_ALT=.*/export TARGET_DEVICE_ALT="ossi, Ossi, RealmeGT5, RMX3820, RE5C33, salami, Salami, OnePlus11"/' "$VSETUP"
              sed -i 's/export OF_SCREEN_H=.*/export OF_SCREEN_H=2772/' "$VSETUP"
            fi

            if [ "${{ env.BUILD_KERNELSU }}" = "true" ]; then
              echo "Enabling KernelSU Addon support in OrangeFox..."
              sed -i 's/FOX_ENABLE_KERNELSU_SUPPORT=.*/export FOX_ENABLE_KERNELSU_SUPPORT=1/' "$VSETUP" || echo "export FOX_ENABLE_KERNELSU_SUPPORT=1" >> "$VSETUP"
            fi
          fi

      - name: Compile OrangeFox Recovery Image
        run: |
          cd ofox_workspace
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export LC_ALL="C"
          export FOX_BUILD_TYPE="Unofficial"

          # Lunch SM8550 OrangeFox profile
          lunch ofox_salami-eng || lunch twrp_salami-eng
          set -e

          # Compile recovery image
          mka recoveryimage -j$(nproc) || mka adbd recoveryimage -j$(nproc)

      - name: Package & Organize Artifacts
        run: |
          cd ofox_workspace
          OUT_DIR="out/target/product/salami"
          OUTPUT_ZIP=$(find "$OUT_DIR" -maxdepth 1 -name "OrangeFox-*.zip" | head -n 1)
          RECOVERY_IMG="$OUT_DIR/recovery.img"

          mkdir -p "${{ github.workspace }}/artifacts"

          if [ -f "$RECOVERY_IMG" ]; then
            echo "Found recovery.img: $RECOVERY_IMG"
            cp "$RECOVERY_IMG" "${{ github.workspace }}/artifacts/OrangeFox-${{ env.DEVICE }}-recovery.img"
          fi

          if [ -f "$OUTPUT_ZIP" ]; then
            echo "Found OrangeFox flashable zip: $OUTPUT_ZIP"
            cp "$OUTPUT_ZIP" "${{ github.workspace }}/artifacts/"
          fi

          cd "${{ github.workspace }}/artifacts"
          sha256sum * > SHA256SUMS.txt
          ls -la

          echo "DELIVERY_NAME=OrangeFox_${{ env.DEVICE }}_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Upload OrangeFox Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DELIVERY_NAME }}
          path: artifacts/
