name: OrangeFox Recovery (OFRP) CI/CD

on:
  workflow_dispatch:
    inputs:
      KERNEL:
        type: choice
        description: "真我 GT5 (RMX3820 / ossi) OGKI 内核 → fox 版本"
        required: true
        default: "5.15.180"
        options:
          - "5.15.180"
          - "5.15.167"
          - "5.15.149"
          - "5.15.123"
      RUNNER:
        type: choice
        description: "运行器：托管 runner 只有约 22G 可用，fox_$OF_BRANCH 全量 sync 放不下；自托管需 ≥64G 空闲且已装 repo/依赖"
        required: true
        default: ubuntu-22.04
        options:
          - ubuntu-22.04
          - self-hosted

jobs:
  build:
    name: OrangeFox GT5 ossi ${{ github.event.inputs.KERNEL }}
    runs-on: ${{ github.event.inputs.RUNNER || 'ubuntu-22.04' }}
    env:
      KERNEL: ${{ github.event.inputs.KERNEL }}
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_MAXSIZE: 15G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Map kernel → fox / ColorOS
        run: |
          case "$KERNEL" in
            5.15.180) echo "OF_BRANCH=16.0" >> $GITHUB_ENV; echo "ANDROID=16" >> $GITHUB_ENV; echo "COLOROS=16.0.3.500" >> $GITHUB_ENV ;;
            5.15.167) echo "OF_BRANCH=14.1" >> $GITHUB_ENV; echo "ANDROID=15" >> $GITHUB_ENV; echo "COLOROS=15.0.0.1400" >> $GITHUB_ENV ;;
            5.15.149) echo "OF_BRANCH=14.1" >> $GITHUB_ENV; echo "ANDROID=15" >> $GITHUB_ENV; echo "COLOROS=15.0.0.320" >> $GITHUB_ENV ;;
            5.15.123) echo "OF_BRANCH=14.1" >> $GITHUB_ENV; echo "ANDROID=14" >> $GITHUB_ENV; echo "COLOROS=14.0.0.1120" >> $GITHUB_ENV ;;
          esac
          echo "DEVICE=ossi"
          echo "MODEL=RMX3820"

      - name: Checkout matching OrangeFox device tree
        uses: actions/checkout@v4
        with:
          ref: OrangeFox-${{ github.event.inputs.KERNEL }}
          path: ofox-branch

      - name: Maximize Build Space (hosted runner only)
        if: github.event.inputs.RUNNER != 'self-hosted'
        env:
          ROOT_RESERVE_MB: '4096'
          TEMP_RESERVE_MB: '2048'
          SWAP_SIZE_MB: '8192'
          BUILD_MOUNT_PATH: '/mnt/ofox_workspace'
          MOUNT_OWNERSHIP: 'runner:runner'
          REMOVE_DOTNET: 'true'
          REMOVE_ANDROID: 'true'
          REMOVE_HASKELL: 'true'
          REMOVE_CODEQL: 'true'
          REMOVE_DOCKER_IMAGES: 'true'
        run: |
          # Never run this on a self-hosted box: it turns free space into LVM PVs.
          df -h
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/node_modules /opt/az /usr/share/swift || true
          bash scripts/maximize-build-space.sh
          echo "OF_WORKSPACE=/mnt/ofox_workspace" >> $GITHUB_ENV
          ln -sfn /mnt/ofox_workspace "${{ github.workspace }}/ofox_workspace"
          echo "--- volume that repo sync will fill ---"
          df -h /mnt/ofox_workspace

      - name: Workspace layout (self-hosted)
        if: github.event.inputs.RUNNER == 'self-hosted'
        run: |
          W="${{ github.workspace }}/ofox_workspace"
          mkdir -p "$W"
          echo "OF_WORKSPACE=$W" >> $GITHUB_ENV
          df -h "$W"

      - name: Space preflight
        run: |
          avail=$(df -BG --output=avail "$OF_WORKSPACE" | tail -1 | tr -dc '0-9')
          echo "usable: ${avail}G at $OF_WORKSPACE (runner=${{ github.event.inputs.RUNNER }})"
          need=${OF_MIN_SPACE_G:-31}
          if [ "$avail" -lt "$need" ]; then
            echo "::error::fox_$OF_BRANCH 全量 sync + recoveryimage 约需 ${need}G，此运行器只有 ${avail}G。托管 runner（73G 盘、约 14G 空闲）上限即此；请以 RUNNER=self-hosted 在 ≥64G 空闲的机器上运行。"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git ccache zip unzip curl wget python3 python-is-python3 \
            libarchive-tools zstd jq openjdk-11-jdk rsync lzop \
            libncurses5 libncurses5-dev libxml2 libxml2-utils \
            squashfs-tools xsltproc patch
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo

      - name: Sync OrangeFox fox_${{ env.OF_BRANCH }}
        run: |
          git config --global user.name "buguj23"
          git config --global user.email "buguj23@users.noreply.github.com"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git sync-tools
          chmod a+x sync-tools/orangefox_sync.sh
          # patches/patch-manifest-fox_*.diff live inside the sync repo
          cd sync-tools
          ./orangefox_sync.sh --branch "$OF_BRANCH" --path "$OF_WORKSPACE"
          cd "$OF_WORKSPACE"
          test -d bootable/recovery/gui/theme || git clone https://gitlab.com/OrangeFox/misc/theme.git bootable/recovery/gui/theme || true

      - name: Install GT5 ossi device tree
        run: |
          mkdir -p "$OF_WORKSPACE/device/realme" "$OF_WORKSPACE/device/oneplus"
          TREE=ofox-branch/recovery/device/realme/ossi
          test -d "$TREE"
          cp -a "$TREE" "$OF_WORKSPACE/device/realme/ossi"
          git clone --depth=1 https://github.com/sunmughan/android_device_oneplus_sm85xx-common.git \
            "$OF_WORKSPACE/device/oneplus/sm85xx-common"
          echo "ossi tree ready kernel=$KERNEL fox=$OF_BRANCH android=$ANDROID coloros=$COLOROS"

      - name: Build recoveryimage
        run: |
          cd "$OF_WORKSPACE"
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export LC_ALL=C
          export FOX_BUILD_TYPE=Unofficial
          lunch ofox_ossi-eng || lunch twrp_ossi-eng
          set -e
          mka recoveryimage -j"$(nproc)" || mka adbd recoveryimage -j"$(nproc)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-GT5-ossi-${{ github.event.inputs.KERNEL }}
          path: |
            ofox_workspace/out/target/product/ossi/*.img
            ofox_workspace/out/target/product/ossi/OrangeFox-*.zip
