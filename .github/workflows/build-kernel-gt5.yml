name: Build Realme GT5 OGKI (5.15.149)

on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "Kernel baseline (single 5.15.149 / RMX3820_15.0.0.320 branch)"
        required: true
        default: 5.15.149
        options:
          - 5.15.149
      KSU_VARIANT:
        type: choice
        description: "Root mode: Pure-OGKI (zero built-in root) or YukiSU-LKM (same-tree CONFIG_KSU=m)"
        required: true
        default: Pure-OGKI
        options:
          - Pure-OGKI
          - YukiSU-LKM
      DYNAMIC_REPO:
        type: string
        description: "Kernel manifest repository owner"
        required: true
        default: "DestoryG"
      MANIFEST_BRANCH:
        type: string
        description: "Kernel manifest branch"
        required: true
        default: "realme/sm8550"
      LTO:
        type: choice
        description: "Clang LTO mode (thin for speed, full for stock parity)"
        required: true
        default: thin
        options:
          - thin
          - full
      FAST_BUILD:
        type: boolean
        description: "Fast Kbuild common/out (disable only for full vendor prepare_vendor.sh)"
        required: true
        default: true
      ENABLE_YUKIZYGISK:
        type: boolean
        description: "Enable YukiZygisk kernel hooks inside YukiSU LKM (ignored in Pure-OGKI)"
        required: true
        default: true
      KSU_SUPERKEY:
        type: string
        description: "Optional SuperKey compiled into YukiSU LKM (leave empty to use manager signature)"
        required: false
        default: ""
      DROID_SPACES:
        type: boolean
        description: "Apply MidAS ghost-task & ntsync container support (optional)"
        required: true
        default: false
      CCM:
        type: boolean
        description: "Apply BBRv3 + ECN congestion control (optional)"
        required: true
        default: false
      ZRAM_LZ4KD:
        type: boolean
        description: "Apply LZ4KD/LZ4K_OPLUS ZRAM patch (modifies zram.ko KMI)"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "Apply Re-Kernel signal driver (optional)"
        required: true
        default: false
      NETFILTER:
        type: boolean
        description: "Enable full Netfilter + IP_SET extensions"
        required: true
        default: false
      LSM_BBG:
        type: boolean
        description: "Apply Baseband-Guard partition protection (optional)"
        required: true
        default: false
      UNICODE_BYPASS:
        type: boolean
        description: "Apply Unicode invisible codepoint fix (Android <= 6.1)"
        required: true
        default: true
      BUILD_NOCACHE:
        type: boolean
        description: "Disable ccache & ThinLTO cache"
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gt5-ogki-${{ inputs.FILE }}-${{ inputs.KSU_VARIANT }}
  cancel-in-progress: true

jobs:
  build:
    name: GT5 5.15.149 (${{ inputs.KSU_VARIANT }}, ${{ inputs.LTO }})
    runs-on: ubuntu-latest
    env:
      REPO_DIR: ${{ github.workspace }}
      WORK: ${{ github.workspace }}/kernel_workspace
      KP_DIR: ${{ github.workspace }}/kernel_workspace/kernel_platform
      CCACHE_DIR: ${{ github.workspace }}/kernel_workspace/.ccache
      THINLTO_CACHE_DIR: ${{ inputs.BUILD_NOCACHE && '' || format('{0}/kernel_workspace/.thinlto-cache', github.workspace) }}
      USE_CCACHE: ${{ inputs.BUILD_NOCACHE && '0' || '1' }}
      FILE: realme_gt5_v
      DYNAMIC_REPO: ${{ inputs.DYNAMIC_REPO }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      KSU_MODE: ${{ inputs.KSU_VARIANT }}
      LTO: ${{ inputs.LTO }}
      FAST_BUILD: ${{ inputs.FAST_BUILD && '1' || '0' }}
      ENABLE_YUKIZYGISK: ${{ inputs.ENABLE_YUKIZYGISK && '1' || '0' }}
      KSU_SUPERKEY: ${{ inputs.KSU_SUPERKEY }}
      APPLY_UNICODE: ${{ inputs.UNICODE_BYPASS && '1' || '0' }}
      APPLY_MIDAS: ${{ inputs.DROID_SPACES && '1' || '0' }}
      APPLY_NTSYNC: ${{ inputs.DROID_SPACES && '1' || '0' }}
      APPLY_DROIDSPACES: ${{ inputs.DROID_SPACES && '1' || '0' }}
      APPLY_BBRV3: ${{ inputs.CCM && '1' || '0' }}
      APPLY_ZRAM: ${{ inputs.ZRAM_LZ4KD && '1' || '0' }}
      APPLY_REKERNEL: ${{ inputs.RE_KERNEL && '1' || '0' }}
      APPLY_NETFILTER: ${{ inputs.NETFILTER && '1' || '0' }}
      APPLY_BBG: ${{ inputs.LSM_BBG && '1' || '0' }}
      APPLY_SUSFS: "0"
      APPLY_KPM: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Maximize build space
        env:
          BUILD_MOUNT_PATH: ${{ github.workspace }}
          REMOVE_DOTNET: "true"
          REMOVE_ANDROID: "true"
          REMOVE_HASKELL: "true"
          REMOVE_CODEQL: "true"
          REMOVE_DOCKER_IMAGES: "true"
        run: bash scripts/maximize-build-space.sh

      - name: Re-checkout after storage resize
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global user.name "gt5-builder"
          git config --global user.email "builder@users.noreply.github.com"

      - name: Restore ccache and ThinLTO caches
        if: ${{ !inputs.BUILD_NOCACHE }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.THINLTO_CACHE_DIR }}
          key: gt5-5.15.149-${{ inputs.LTO }}-${{ inputs.FAST_BUILD }}-${{ github.run_id }}
          restore-keys: |
            gt5-5.15.149-${{ inputs.LTO }}-${{ inputs.FAST_BUILD }}-

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++ git clang lld llvm \
            libelf-dev libssl-dev libxml2-utils lzip python3 rsync tar unzip zip zstd

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch OEM OGKI sources (realme_gt5_v / 5.15.149)
        run: bash scripts/00-fetch.sh

      - name: Apply selected OGKI patches
        run: bash scripts/10-patch.sh

      - name: Build OGKI kernel and optional YukiSU LKM
        run: bash scripts/20-build.sh

      - name: Check patch rejects
        run: |
          source scripts/check_rejects.sh
          check_rejects "$KP_DIR/common"

      - name: Package AnyKernel3, KMI SDK, and ROM kernel package
        run: |
          mkdir -p out/artifacts
          bash scripts/30-package.sh

      - name: Verify kernel-package integrity
        run: |
          PKG_DIR="$WORK/verify-pkg"
          mkdir -p "$PKG_DIR"
          tar --zstd -xf out/artifacts/kernel-package/kernel-package.tar.zst -C "$PKG_DIR"
          python3 scripts/rom_kernel_package.py verify "$PKG_DIR" \
            --branch 5.15.149 --variant "${{ inputs.KSU_VARIANT }}" --commit "${{ github.sha }}"

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_${{ inputs.KSU_VARIANT }}_GT5_5.15.149
          path: out/artifacts/AnyKernel3_${{ inputs.KSU_VARIANT }}_GT5_5.15.149*.zip
          if-no-files-found: error

      - name: Upload KMI SDK (Module.symvers + .config + vmlinux)
        uses: actions/upload-artifact@v4
        with:
          name: kmi-sdk_${{ inputs.KSU_VARIANT }}_5.15.149
          path: out/artifacts/kmi-sdk/
          if-no-files-found: error

      - name: Upload ROM kernel-package
        uses: actions/upload-artifact@v4
        with:
          name: kernel-package_${{ inputs.KSU_VARIANT }}_5.15.149
          path: out/artifacts/kernel-package/
          if-no-files-found: error
