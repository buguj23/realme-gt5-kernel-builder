name: Build Realme GT5 OGKI (5.15.149)

on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "Kernel baseline (single 5.15.149 / RMX3820_15.0.0.320 branch)"
        required: true
        default: 5.15.149
        options:
          - 5.15.149
      KSU_VARIANT:
        type: choice
        description: "Root mode: Pure-OGKI (zero built-in root) or YukiSU-LKM (same-tree CONFIG_KSU=m)"
        required: true
        default: Pure-OGKI
        options:
          - Pure-OGKI
          - YukiSU-LKM
      DYNAMIC_REPO:
        type: string
        description: "Kernel manifest repository owner"
        required: true
        default: "DestoryG"
      MANIFEST_BRANCH:
        type: string
        description: "Kernel manifest branch"
        required: true
        default: "realme/sm8550"
      LTO:
        type: choice
        description: "Clang LTO mode (thin for speed, full for stock parity)"
        required: true
        default: thin
        options:
          - thin
          - full
      FAST_BUILD:
        type: boolean
        description: "Fast Kbuild common/out (disable only for full vendor prepare_vendor.sh)"
        required: true
        default: true
      ENABLE_YUKIZYGISK:
        type: boolean
        description: "Enable YukiZygisk kernel hooks inside YukiSU LKM (ignored in Pure-OGKI)"
        required: true
        default: true
      KSU_SUPERKEY:
        type: string
        description: "Optional SuperKey compiled into YukiSU LKM (leave empty to use manager signature)"
        required: false
        default: ""
      DROID_SPACES:
        type: boolean
        description: "Apply MidAS ghost-task & ntsync container support (optional)"
        required: true
        default: false
      CCM:
        type: boolean
        description: "Apply BBRv3 + ECN congestion control (optional)"
        required: true
        default: false
      ZRAM_LZ4KD:
        type: boolean
        description: "Apply LZ4KD/LZ4K_OPLUS ZRAM patch (modifies zram.ko KMI)"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "Apply Re-Kernel signal driver (optional)"
        required: true
        default: false
      NETFILTER:
        type: boolean
        description: "Enable full Netfilter + IP_SET extensions"
        required: true
        default: false
      LSM_BBG:
        type: boolean
        description: "Apply Baseband-Guard partition protection (optional)"
        required: true
        default: false
      UNICODE_BYPASS:
        type: boolean
        description: "Apply Unicode invisible codepoint fix (Android <= 6.1)"
        required: true
        default: true
      BUILD_NOCACHE:
        type: boolean
        description: "Disable ccache & ThinLTO cache"
        required: true
        default: false
      runner:
        type: choice
        description: "Target runner (default: domestic self-hosted preemptible instance)"
        required: true
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest
      clean_workdir:
        type: boolean
        description: "Wipe kernel_workspace before sync (leave false on preemptible instances to resume cleanly)"
        required: true
        default: false
      verify_stock_kmi:
        type: boolean
        description: "Fetch verified RMX3820_15.0.0.320 kernel/DLKM baseline and verify 3260 stock symbol CRCs"
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: gt5-ogki-${{ inputs.FILE }}-${{ inputs.KSU_VARIANT }}
  cancel-in-progress: true

jobs:
  build:
    name: GT5 5.15.149 (${{ inputs.KSU_VARIANT }}, ${{ inputs.LTO }})
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    env:
      REPO_DIR: ${{ github.workspace }}
      USE_CCACHE: ${{ inputs.BUILD_NOCACHE && '0' || '1' }}
      FILE: realme_gt5_v
      DYNAMIC_REPO: ${{ inputs.DYNAMIC_REPO }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      KSU_MODE: ${{ inputs.KSU_VARIANT }}
      LTO: ${{ inputs.LTO }}
      FAST_BUILD: ${{ inputs.FAST_BUILD && '1' || '0' }}
      ENABLE_YUKIZYGISK: ${{ inputs.ENABLE_YUKIZYGISK && '1' || '0' }}
      KSU_SUPERKEY: ${{ inputs.KSU_SUPERKEY }}
      APPLY_UNICODE: ${{ inputs.UNICODE_BYPASS && '1' || '0' }}
      APPLY_MIDAS: ${{ inputs.DROID_SPACES && '1' || '0' }}
      APPLY_NTSYNC: ${{ inputs.DROID_SPACES && '1' || '0' }}
      APPLY_DROIDSPACES: ${{ inputs.DROID_SPACES && '1' || '0' }}
      APPLY_BBRV3: ${{ inputs.CCM && '1' || '0' }}
      APPLY_ZRAM: ${{ inputs.ZRAM_LZ4KD && '1' || '0' }}
      APPLY_REKERNEL: ${{ inputs.RE_KERNEL && '1' || '0' }}
      APPLY_NETFILTER: ${{ inputs.NETFILTER && '1' || '0' }}
      APPLY_BBG: ${{ inputs.LSM_BBG && '1' || '0' }}
      APPLY_SUSFS: "0"
      APPLY_KPM: "0"

    steps:
      - name: Checkout repository (self-hosted multi-mirror)
        if: runner.environment != 'github-hosted'
        run: |
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          REPO_URL="https://github.com/${{ github.repository }}.git"
          OK=0
          for prefix in "https://cdn.gh-proxy.org/" "https://edgeone.gh-proxy.org/" "https://gh-proxy.org/" "https://v6.gh-proxy.org/" "https://gh-proxy.com/" ""; do
            echo "Trying checkout: ${prefix:-direct}${REPO_URL} @ ${{ github.sha }}"
            if GIT_TERMINAL_PROMPT=0 git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 clone --depth=1 --branch "${{ github.ref_name }}" "${prefix}${REPO_URL}" "$GITHUB_WORKSPACE" && \
               GIT_TERMINAL_PROMPT=0 git -C "$GITHUB_WORKSPACE" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 fetch --depth=1 "${prefix}${REPO_URL}" "${{ github.sha }}" && \
               git -C "$GITHUB_WORKSPACE" checkout -f FETCH_HEAD; then
              OK=1
              break
            fi
            rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          done
          [ "$OK" = 1 ] || exit 1

      - name: Checkout repository (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure runner paths and mirror mode
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            echo "MIRROR_MODE=direct" >> "$GITHUB_ENV"
            echo "WORK=$GITHUB_WORKSPACE/kernel_workspace" >> "$GITHUB_ENV"
            echo "KP_DIR=$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/kernel_workspace/.ccache" >> "$GITHUB_ENV"
            echo "STOCK_CACHE_DIR=$GITHUB_WORKSPACE/kernel_workspace/.stock-15.0.0.320" >> "$GITHUB_ENV"
            if [ "${{ inputs.BUILD_NOCACHE }}" != "true" ]; then
              echo "THINLTO_CACHE_DIR=$GITHUB_WORKSPACE/kernel_workspace/.thinlto-cache" >> "$GITHUB_ENV"
            else
              echo "THINLTO_CACHE_DIR=" >> "$GITHUB_ENV"
            fi
          else
            echo "MIRROR_MODE=cn" >> "$GITHUB_ENV"
            echo "WORK=$HOME/gt5_kernel_5_15_149" >> "$GITHUB_ENV"
            echo "KP_DIR=$HOME/gt5_kernel_5_15_149/kernel_platform" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.cache/gt5-kernel-5.15.149/ccache" >> "$GITHUB_ENV"
            echo "STOCK_CACHE_DIR=$HOME/.cache/gt5-stock/15.0.0.320" >> "$GITHUB_ENV"
            if [ "${{ inputs.BUILD_NOCACHE }}" != "true" ]; then
              echo "THINLTO_CACHE_DIR=$HOME/.cache/gt5-kernel-5.15.149/thinlto" >> "$GITHUB_ENV"
            else
              echo "THINLTO_CACHE_DIR=" >> "$GITHUB_ENV"
            fi
          fi

      - name: Maximize build space
        if: runner.environment == 'github-hosted'
        env:
          BUILD_MOUNT_PATH: ${{ github.workspace }}
          REMOVE_DOTNET: "true"
          REMOVE_ANDROID: "true"
          REMOVE_HASKELL: "true"
          REMOVE_CODEQL: "true"
          REMOVE_DOCKER_IMAGES: "true"
        run: bash scripts/maximize-build-space.sh

      - name: Re-checkout after storage resize
        if: runner.environment == 'github-hosted'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git and clean stale preemptible locks
        run: |
          if [ "${{ inputs.clean_workdir }}" = "true" ]; then
            rm -rf "$WORK"
          fi
          mkdir -p "$WORK" "$CCACHE_DIR" "${THINLTO_CACHE_DIR:-$WORK/.tmp-lto}"
          source scripts/lib-mirror.sh
          repo_clean_locks "$WORK"
          git config --global user.name "gt5-builder"
          git config --global user.email "builder@users.noreply.github.com"

      - name: Restore ccache and ThinLTO caches (GitHub-hosted only)
        if: ${{ !inputs.BUILD_NOCACHE && runner.environment == 'github-hosted' }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.THINLTO_CACHE_DIR }}
          key: gt5-5.15.149-${{ inputs.LTO }}-${{ inputs.FAST_BUILD }}-${{ github.run_id }}
          restore-keys: |
            gt5-5.15.149-${{ inputs.LTO }}-${{ inputs.FAST_BUILD }}-

      - name: Install build dependencies (CN mirror aware)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          PKGS=(
            aria2 bc bison build-essential ccache cpio curl flex g++ git clang lld llvm
            libelf-dev libssl-dev libxml2-utils lzip python3 python3-yaml rsync tar unzip zip zstd
            device-tree-compiler erofs-utils e2fsprogs android-sdk-libsparse-utils mkbootimg gh
          )
          missing=0
          for p in "${PKGS[@]}"; do
            dpkg -s "$p" >/dev/null 2>&1 || { missing=1; break; }
          done
          if [ "$missing" = 1 ]; then
            if [ "${MIRROR_MODE:-auto}" = "cn" ]; then
              sudo python3 scripts/mirror_helper.py configure-apt
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${PKGS[@]}"
          else
            echo "All required build packages already installed."
          fi
          if ! command -v avbtool >/dev/null 2>&1; then
            tmp_avb=$(mktemp)
            python3 scripts/mirror_helper.py download --output "$tmp_avb" --expect-token "#!/usr/bin/env python" \
              "https://raw.githubusercontent.com/LineageOS/android_external_avb/lineage-22.2/avbtool.py"
            sudo install -m 0755 "$tmp_avb" /usr/local/bin/avbtool
            rm -f "$tmp_avb"
          fi
          if ! mkbootimg --help >/dev/null 2>&1; then
            sudo mkdir -p /usr/local/share/mkbootimg/gki
            tmp_mk=$(mktemp)
            tmp_gki=$(mktemp)
            python3 scripts/mirror_helper.py download --output "$tmp_mk" --expect-token "#!/usr/bin/env python" \
              "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-22.2/mkbootimg.py"
            python3 scripts/mirror_helper.py download --output "$tmp_gki" \
              "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-22.2/gki/generate_gki_certificate.py"
            sudo install -m 0755 "$tmp_mk" /usr/local/share/mkbootimg/mkbootimg.py
            sudo install -m 0644 "$tmp_gki" /usr/local/share/mkbootimg/gki/generate_gki_certificate.py
            sudo ln -sfn /usr/local/share/mkbootimg/mkbootimg.py /usr/local/bin/mkbootimg
            rm -f "$tmp_mk" "$tmp_gki"
          fi

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Install repo tool (multi-mirror)
        run: |
          python3 scripts/mirror_helper.py ensure-repo --output "$HOME/.local/bin/repo" --mode "$MIRROR_MODE"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch OEM OGKI sources (realme_gt5_v / 5.15.149)
        run: bash scripts/00-fetch.sh

      - name: Apply selected OGKI patches
        run: bash scripts/10-patch.sh

      - name: Build OGKI kernel and optional YukiSU LKM
        run: bash scripts/20-build.sh

      - name: Check patch rejects
        run: |
          source scripts/check_rejects.sh
          check_rejects "$KP_DIR/common"

      - name: Package AnyKernel3, KMI SDK, and ROM kernel package
        run: |
          mkdir -p out/artifacts
          bash scripts/30-package.sh

      - name: Verify kernel-package integrity
        run: |
          PKG_DIR="$WORK/verify-pkg"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          tar --zstd -xf out/artifacts/kernel-package/kernel-package.tar.zst -C "$PKG_DIR"
          python3 scripts/rom_kernel_package.py verify "$PKG_DIR" \
            --branch 5.15.149 --variant "${{ inputs.KSU_VARIANT }}" --commit "${{ github.sha }}"

      - name: Verify CRCs against stock RMX3820_15.0.0.320 modules
        if: ${{ inputs.verify_stock_kmi && !inputs.ZRAM_LZ4KD && !inputs.CCM && !inputs.NETFILTER && !inputs.DROID_SPACES }}
        run: |
          bash scripts/fetch-stock.sh --mode kernel --dest "$STOCK_CACHE_DIR"
          MOD_DIR="$WORK/stock-ko-verify"
          PKG_DIR="$WORK/verify-pkg"
          rm -rf "$MOD_DIR"
          mkdir -p "$MOD_DIR"
          python3 scripts/rom_modules.py stock \
            --branch 5.15.149 \
            "$STOCK_CACHE_DIR" \
            "$MOD_DIR/staged"
          python3 scripts/kmi.py symvers "$PKG_DIR/Module.symvers"
          python3 scripts/kmi.py image "$PKG_DIR/Image" --crc 0x0222dd63
          python3 scripts/40-verify-crc.py "$PKG_DIR/Module.symvers" "$MOD_DIR/staged" \
            --recursive --allow-ko-providers

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_${{ inputs.KSU_VARIANT }}_GT5_5.15.149
          path: out/artifacts/AnyKernel3_${{ inputs.KSU_VARIANT }}_GT5_5.15.149*.zip
          if-no-files-found: error

      - name: Upload KMI SDK (Module.symvers + .config + vmlinux)
        uses: actions/upload-artifact@v4
        with:
          name: kmi-sdk_${{ inputs.KSU_VARIANT }}_5.15.149
          path: out/artifacts/kmi-sdk/
          if-no-files-found: error

      - name: Upload ROM kernel-package
        uses: actions/upload-artifact@v4
        with:
          name: kernel-package_${{ inputs.KSU_VARIANT }}_5.15.149
          path: out/artifacts/kernel-package/
          if-no-files-found: error
