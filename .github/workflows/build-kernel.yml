name: Realme GT5 & OnePlus Ace 2 Pro Kernel CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/build-orangefox.yml'
  workflow_dispatch:
    inputs:
      DEVICE:
        type: choice
        description: "Target Device Configuration"
        required: true
        default: oneplus_ace2_pro_b
        options:
          - oneplus_ace2_pro_b
          - realme_gt5_b
      ROOT_STACK:
        type: choice
        description: "Root & Stealth Stack Engine"
        required: true
        default: YukiSU
        options:
          - YukiSU
          - BakaSU
          - KernelSU-Next
          - Stock
      ENABLE_KASUMI:
        type: boolean
        description: "Compile & Embed Kasumi VFS Stealth Module (kasumi_lkm.ko)"
        required: true
        default: true
      DROID_SPACES:
        type: boolean
        description: "Apply DroidSpaces MidAS patch (ghost-task-for-midas)"
        required: true
        default: true
      RE_KERNEL:
        type: boolean
        description: "Integrate Re-Kernel Task Scheduler & Unfreeze"
        required: true
        default: true
      ZRAM_LZ4KD:
        type: boolean
        description: "Enable 12GB ZRAM with LZ4KD Compression"
        required: true
        default: true
      UTS_UNAME_SPOOF:
        type: boolean
        description: "Spoof UTS uname string to Official Qualcomm GKI"
        required: true
        default: true
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Incremental Build (ThinLTO + Ccache)"
        required: true
        default: true

jobs:
  build:
    name: "Build SM8550 Kernel"
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event.inputs.DEVICE || 'oneplus_ace2_pro_b' }}
      ROOT_STACK: ${{ github.event.inputs.ROOT_STACK || 'YukiSU' }}
      ENABLE_KASUMI: ${{ github.event.inputs.ENABLE_KASUMI || 'true' }}
      DROID_SPACES: ${{ github.event.inputs.DROID_SPACES || 'true' }}
      RE_KERNEL: ${{ github.event.inputs.RE_KERNEL || 'true' }}
      ZRAM_LZ4KD: ${{ github.event.inputs.ZRAM_LZ4KD || 'true' }}
      UTS_UNAME_SPOOF: ${{ github.event.inputs.UTS_UNAME_SPOOF || 'true' }}
      FAST_BUILD: ${{ github.event.inputs.FAST_BUILD || 'true' }}
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_MAXSIZE: 10G
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          echo "Maximizing root disk space cleanly..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          
          # Setup 10GB dedicated swap on /mnt
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          
          echo "Disk space after cleanup:"
          df -h

      - name: Install Build Dependencies
        run: |
          # Configure resilient DNS fallbacks to prevent intermittent cloud resolution issues
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf

          sudo apt-get clean
          for i in 1 2 3 4 5; do
            sudo apt-get update && break || { echo "Retrying apt-get update ($i)..."; sleep 5; }
          done

          for i in 1 2 3 4 5; do
            sudo apt-get install -y --fix-missing --no-install-recommends \
              build-essential bc bison flex libssl-dev libelf-dev \
              git ccache zip unzip curl wget python3 python3-pip \
              libarchive-tools zstd jq openjdk-17-jdk patch && break || { echo "Retrying apt-get install ($i)..."; sleep 10; }
          done

          # Setup Android Repo tool
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Setup Ccache Environment
        uses: actions/cache@v4
        if: ${{ env.FAST_BUILD == 'true' }}
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEVICE }}-${{ env.ROOT_STACK }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEVICE }}-
            ccache-${{ runner.os }}-

      - name: Sync Kernel Source Tree
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          TARGET_FILE="${{ env.DEVICE }}"
          if [ "$TARGET_FILE" = "realme_gt5_b" ]; then
            TARGET_FILE="oneplus_ace2_pro_b"
          fi

          echo "Initializing repo with OnePlusOSS SM8550 manifest (${TARGET_FILE}.xml)..."
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8550 \
            -m "${TARGET_FILE}.xml" \
            --depth=1 --no-clone-bundle --no-tags

          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          # Disable protected exports & ABI strict checks
          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || true
          done

          if [ -f kernel_platform/common/build.config.gki ]; then
            sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki
          fi
          if [ -f kernel_platform/build/kernel/kleaf/common_kernels.bzl ]; then
            sed -i 's/check_defconfig = None,/check_defconfig = "disabled",/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
            sed -i 's/if check_defconfig == None:/if False:  # check_defconfig == None:/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
          fi

      - name: Apply Core Patches (MidAS, Re-Kernel, ZRAM, BBG)
        run: |
          cd kernel_workspace/kernel_platform
          PATCH_DIR="${{ github.workspace }}/patches"

          # 1. DroidSpaces MidAS patch to prevent Oplus scheduler panics
          if [ "${{ env.DROID_SPACES }}" = "true" ] && [ -f "$PATCH_DIR/ghost-task-for-midas.patch" ]; then
            echo "Applying DroidSpaces MidAS scheduler patch..."
            patch -p1 --forward < "$PATCH_DIR/ghost-task-for-midas.patch" || true
          fi

          # 2. Disable LSM_BBG to prevent loop device deadlock
          echo "CONFIG_SECURITY_DEFEX=n" >> common/arch/arm64/configs/gki_defconfig || true
          echo "CONFIG_LSM_BBG=n" >> common/arch/arm64/configs/gki_defconfig || true

          # 3. ZRAM LZ4KD
          if [ "${{ env.ZRAM_LZ4KD }}" = "true" ]; then
            echo "Enabling 12GB ZRAM LZ4KD..."
            echo "CONFIG_ZRAM=y" >> common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> common/arch/arm64/configs/gki_defconfig
          fi

      - name: Integrate Root Engine (${{ env.ROOT_STACK }})
        run: |
          cd kernel_workspace/kernel_platform
          STACK="${{ env.ROOT_STACK }}"

          if [ "$STACK" = "YukiSU" ]; then
            echo "Integrating YukiSU LKM & Kasumi VFS stealth..."
            git clone --depth=1 https://github.com/Rouyashiki/YukiSU.git SukiSU_src
            mkdir -p common/drivers/kernelsu
            cp -r SukiSU_src/kernel/* common/drivers/kernelsu/
            
            # Comprehensively populate UAPI headers for all include path patterns
            rm -rf common/drivers/kernelsu/include/uapi
            cp -r SukiSU_src/uapi common/drivers/kernelsu/include/uapi
            cp -r SukiSU_src/uapi common/drivers/kernelsu/uapi
            mkdir -p common/drivers/uapi
            cp -r SukiSU_src/uapi/* common/drivers/uapi/

            # Hook into drivers/Makefile and drivers/Kconfig
            echo "obj-\$(CONFIG_KSU) += kernelsu/" >> common/drivers/Makefile
            echo 'source "drivers/kernelsu/Kconfig"' >> common/drivers/Kconfig
            echo 'obj-$(CONFIG_KSU) += kernelsu.o' > common/drivers/kernelsu/Makefile
            echo 'include $(src)/Kbuild' >> common/drivers/kernelsu/Makefile
            
            # Configure KSU as LKM with Kasumi & YukiZygisk
            echo "CONFIG_KSU=m" >> common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_YUKIZYGISK=y" >> common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUPERKEY=y" >> common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_MODULES=y" >> common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_MODVERSIONS=y" >> common/arch/arm64/configs/gki_defconfig

          elif [ "$STACK" = "BakaSU" ]; then
            echo "Integrating BakaSU with Inline Hook..."
            curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs || true
            echo "CONFIG_KSU=y" >> common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS=y" >> common/arch/arm64/configs/gki_defconfig
          fi

      - name: Build Kernel Image & Modules
        run: |
          cd kernel_workspace
          export LTO=thin
          export SYSTEM_DLKM_RE_SIGN=0
          export BUILD_SYSTEM_DLKM=0
          export KMI_SYMBOL_LIST_STRICT_MODE=0

          # Build target for SM8550 Kalama GKI
          ./kernel_platform/oplus/build/oplus_build_kernel.sh kalama gki

      - name: Package Output (AnyKernel3 & Boot Image)
        run: |
          git clone --depth=1 https://github.com/Numbersf/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          IMAGE_PATH=$(find kernel_workspace/kernel_platform/ -name "Image" | head -n 1)
          if [ -z "$IMAGE_PATH" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

          echo "Found kernel Image: $IMAGE_PATH"
          cp "$IMAGE_PATH" AnyKernel3/Image

          # Package modules
          mkdir -p AnyKernel3/modules/vendor_dlkm
          find kernel_workspace/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor_dlkm/ \; 2>/dev/null || true

          # Explicitly copy kernelsu.ko if generated
          KSU_KO=$(find kernel_workspace/ -name "kernelsu.ko" | head -n 1)
          if [ -n "$KSU_KO" ]; then
            echo "Found YukiSU module: $KSU_KO"
            cp "$KSU_KO" AnyKernel3/
          fi

          # Enable modules flashing in AnyKernel3
          sed -i 's/do.modules=0/do.modules=1/' AnyKernel3/anykernel.sh

          # Create flashable zip
          cd AnyKernel3
          ZIP_NAME="RealmeGT5_SM8550_${{ env.ROOT_STACK }}_$(date +%Y%m%d_%H%M%S).zip"
          zip -r9 "../$ZIP_NAME" *
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
