name: Build Project Infinity-X (ossi)

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Optional run ID of a compatible GT5 kernel build"
        required: false
        default: ""
      kernel_file:
        description: "Stock ROM baseline"
        type: choice
        required: true
        default: "5.15.180"
        options: ["5.15.180", "5.15.167", "5.15.149", "5.15.123"]
      ksu_variant:
        description: "Kernel package variant"
        type: choice
        required: true
        default: BakaSU
        options: [BakaSU, SukiSU-Nova, FinaSU]
      source_dir:
        description: "Android checkout on the runner (default: ~/gt5-rom/<branch>)"
        required: false
        default: ""
      stock_dir:
        description: "Verified stock input directory (default: ~/gt5-stock/<branch>)"
        required: false
        default: ""
      stock_slot:
        description: "Active stock slot when both groups in the LP dump match"
        type: choice
        default: auto
        options: [auto, a, b]
      run_build:
        description: "Build and verify a userdebug ROM on the self-hosted runner"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.kernel.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ROM unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Resolve and verify matching kernel package
        id: kernel
        env:
          GH_TOKEN: ${{ github.token }}
          WANTRUN: ${{ inputs.kernel_run_id }}
          BRANCH: ${{ inputs.kernel_file }}
          VARIANT: ${{ inputs.ksu_variant }}
        run: |
          python3 scripts/rom-resolve-kernel.py --repo "$GITHUB_REPOSITORY" \
            --branch "$BRANCH" --variant "$VARIANT" --run-id "$WANTRUN" \
            --output "$RUNNER_TEMP/ossi-kernel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  build:
    if: ${{ inputs.run_build }}
    needs: verify
    runs-on: [self-hosted, linux, x64, gt5-rom]
    concurrency:
      group: ossi-self-hosted-rom
      cancel-in-progress: false
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the verified kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WANTRUN: ${{ needs.verify.outputs.run-id }}
          BRANCH: ${{ inputs.kernel_file }}
          VARIANT: ${{ inputs.ksu_variant }}
        run: |
          python3 scripts/rom-resolve-kernel.py --repo "$GITHUB_REPOSITORY" \
            --branch "$BRANCH" --variant "$VARIANT" --run-id "$WANTRUN" \
            --output "$RUNNER_TEMP/ossi-kernel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Build and verify target-files and OTA
        env:
          BRANCH: ${{ inputs.kernel_file }}
          ROM_SOURCE: ${{ inputs.source_dir }}
          STOCK_DIR: ${{ inputs.stock_dir }}
          STOCK_SLOT: ${{ inputs.stock_slot }}
        run: |
          set -euo pipefail
          SRC="${ROM_SOURCE:-$HOME/gt5-rom/$BRANCH}"
          STOCK="${STOCK_DIR:-$HOME/gt5-stock/$BRANCH}"
          stock_args=()
          if [[ "$STOCK_SLOT" != auto ]]; then stock_args+=(--stock-slot "$STOCK_SLOT"); fi
          bash scripts/rom-build-local.sh --sync --src "$SRC" --branch "$BRANCH" \
            --stock-images "$STOCK" \
            --pkg "$RUNNER_TEMP/ossi-kernel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/ossi-rom-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${stock_args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: ossi_userdebug_${{ inputs.kernel_file }}_${{ inputs.ksu_variant }}
          path: ${{ runner.temp }}/ossi-rom-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
