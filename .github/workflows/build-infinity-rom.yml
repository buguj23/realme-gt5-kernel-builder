name: Build Project Infinity-X (ossi)

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Optional run ID of a compatible 5.15.149 GT5 kernel build"
        required: false
        default: ""
      kernel_file:
        description: "Stock ROM baseline (single 5.15.149 / RMX3820_15.0.0.320 branch)"
        type: choice
        required: true
        default: "5.15.149"
        options: ["5.15.149"]
      ksu_variant:
        description: "Kernel package variant"
        type: choice
        required: true
        default: Pure-OGKI
        options: [Pure-OGKI, YukiSU-LKM]
      source_dir:
        description: "Android checkout on the runner (default: ~/gt5-rom/5.15.149)"
        required: false
        default: ""
      stock_dir:
        description: "Verified stock input directory (default: ~/gt5-stock/5.15.149)"
        required: false
        default: ""
      stock_slot:
        description: "Active stock slot when both groups in the LP dump match"
        type: choice
        default: auto
        options: [auto, a, b]
      run_build:
        description: "Build and verify a userdebug ROM on the runner"
        type: boolean
        default: false
      upload_mode:
        description: "Artifact upload scope (metadata-only preserves ECS ¥0.8/GB outbound)"
        type: choice
        required: true
        default: metadata-only
        options:
          - metadata-only
          - ota-only
          - full
      runner:
        description: "Runner for verify job (default: domestic self-hosted instance)"
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest
      rom_runner:
        description: "Runner label for full ROM build job"
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - gt5-rom
          - ubuntu-latest

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    outputs:
      run-id: ${{ steps.kernel.outputs.run-id }}
    steps:
      - name: Checkout repository (self-hosted multi-mirror)
        if: runner.environment != 'github-hosted'
        run: |
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          REPO_URL="https://github.com/${{ github.repository }}.git"
          OK=0
          for prefix in "https://cdn.gh-proxy.org/" "https://edgeone.gh-proxy.org/" "https://gh-proxy.org/" "https://v6.gh-proxy.org/" "https://gh-proxy.com/" ""; do
            echo "Trying checkout: ${prefix:-direct}${REPO_URL} @ ${{ github.sha }}"
            if GIT_TERMINAL_PROMPT=0 git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 clone --depth=1 --branch "${{ github.ref_name }}" "${prefix}${REPO_URL}" "$GITHUB_WORKSPACE" && \
               GIT_TERMINAL_PROMPT=0 git -C "$GITHUB_WORKSPACE" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 fetch --depth=1 "${prefix}${REPO_URL}" "${{ github.sha }}" && \
               git -C "$GITHUB_WORKSPACE" checkout -f FETCH_HEAD; then
              OK=1
              break
            fi
            rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          done
          [ "$OK" = 1 ] || exit 1
      - name: Checkout repository (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure mirror mode
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            echo "MIRROR_MODE=direct" >> "$GITHUB_ENV"
          else
            echo "MIRROR_MODE=cn" >> "$GITHUB_ENV"
          fi
      - name: ROM unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Resolve and verify matching kernel package
        id: kernel
        env:
          GH_TOKEN: ${{ github.token }}
          WANTRUN: ${{ inputs.kernel_run_id }}
          BRANCH: ${{ inputs.kernel_file }}
          VARIANT: ${{ inputs.ksu_variant }}
        run: |
          python3 scripts/rom-resolve-kernel.py --repo "$GITHUB_REPOSITORY" \
            --branch "$BRANCH" --variant "$VARIANT" --run-id "$WANTRUN" \
            --output "$RUNNER_TEMP/ossi-kernel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  build:
    if: ${{ inputs.run_build }}
    needs: verify
    runs-on: ${{ fromJSON(inputs.rom_runner == 'gt5-rom' && '["self-hosted","linux","x64","gt5-rom"]' || (inputs.rom_runner == 'ubuntu-latest' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]')) }}
    concurrency:
      group: ossi-self-hosted-rom
      cancel-in-progress: false
    timeout-minutes: 720
    steps:
      - name: Checkout repository (self-hosted multi-mirror)
        if: runner.environment != 'github-hosted'
        run: |
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          REPO_URL="https://github.com/${{ github.repository }}.git"
          OK=0
          for prefix in "https://cdn.gh-proxy.org/" "https://edgeone.gh-proxy.org/" "https://gh-proxy.org/" "https://v6.gh-proxy.org/" "https://gh-proxy.com/" ""; do
            echo "Trying checkout: ${prefix:-direct}${REPO_URL} @ ${{ github.sha }}"
            if GIT_TERMINAL_PROMPT=0 git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 clone --depth=1 --branch "${{ github.ref_name }}" "${prefix}${REPO_URL}" "$GITHUB_WORKSPACE" && \
               GIT_TERMINAL_PROMPT=0 git -C "$GITHUB_WORKSPACE" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 fetch --depth=1 "${prefix}${REPO_URL}" "${{ github.sha }}" && \
               git -C "$GITHUB_WORKSPACE" checkout -f FETCH_HEAD; then
              OK=1
              break
            fi
            rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          done
          [ "$OK" = 1 ] || exit 1
      - name: Checkout repository (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure mirror mode
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            echo "MIRROR_MODE=direct" >> "$GITHUB_ENV"
          else
            echo "MIRROR_MODE=cn" >> "$GITHUB_ENV"
          fi
      - name: Ensure domestic runner tools and ROM dependencies
        run: |
          if ! command -v aria2c >/dev/null 2>&1 || ! command -v fsck.erofs >/dev/null 2>&1 || ! command -v repo >/dev/null 2>&1 || ! command -v avbtool >/dev/null 2>&1 || ! command -v mkbootimg >/dev/null 2>&1 || ! command -v dtc >/dev/null 2>&1; then
            bash scripts/setup-cn-runner.sh --with-rom-deps
          fi
      - name: Fetch the verified kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WANTRUN: ${{ needs.verify.outputs.run-id }}
          BRANCH: ${{ inputs.kernel_file }}
          VARIANT: ${{ inputs.ksu_variant }}
        run: |
          python3 scripts/rom-resolve-kernel.py --repo "$GITHUB_REPOSITORY" \
            --branch "$BRANCH" --variant "$VARIANT" --run-id "$WANTRUN" \
            --output "$RUNNER_TEMP/ossi-kernel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Build and verify target-files and OTA
        env:
          BRANCH: ${{ inputs.kernel_file }}
          ROM_SOURCE: ${{ inputs.source_dir }}
          STOCK_DIR: ${{ inputs.stock_dir }}
          STOCK_SLOT: ${{ inputs.stock_slot }}
          UPLOAD_MODE: ${{ inputs.upload_mode }}
        run: |
          set -euo pipefail
          SRC="${ROM_SOURCE:-$HOME/gt5-rom/$BRANCH}"
          STOCK="${STOCK_DIR:-$HOME/gt5-stock/$BRANCH}"
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ] && [ -w "$HOME" ]; then
            DELIVERY_DIR="$HOME/ossi-deliveries/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            DELIVERY_DIR="$RUNNER_TEMP/ossi-rom-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          UPLOAD_DIR="$RUNNER_TEMP/ossi-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DELIVERY_DIR" "$UPLOAD_DIR"
          source scripts/lib-mirror.sh
          repo_clean_locks "$SRC"
          stock_args=()
          if [[ "$STOCK_SLOT" != auto ]]; then stock_args+=(--stock-slot "$STOCK_SLOT"); fi
          bash scripts/rom-build-local.sh --sync --auto-fetch-stock --src "$SRC" --branch "$BRANCH" \
            --stock-images "$STOCK" \
            --pkg "$RUNNER_TEMP/ossi-kernel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$DELIVERY_DIR" "${stock_args[@]}"
          (
            cd "$DELIVERY_DIR"
            sha256sum * > SHA256SUMS.txt
          )
          cp -f "$DELIVERY_DIR/rom-delivery.json" "$DELIVERY_DIR/SHA256SUMS.txt" "$UPLOAD_DIR/"
          [ -f "$DELIVERY_DIR/source-manifest.xml" ] && cp -f "$DELIVERY_DIR/source-manifest.xml" "$UPLOAD_DIR/" || true
          if [ "$UPLOAD_MODE" = "full" ]; then
            for f in "$DELIVERY_DIR"/*; do
              [ -f "$f" ] && (ln -f "$f" "$UPLOAD_DIR/" 2>/dev/null || cp -f "$f" "$UPLOAD_DIR/")
            done
          elif [ "$UPLOAD_MODE" = "ota-only" ]; then
            for f in "$DELIVERY_DIR"/*.zip; do
              case "$(basename "$f")" in
                *target_files*) ;;
                *) [ -f "$f" ] && (ln -f "$f" "$UPLOAD_DIR/" 2>/dev/null || cp -f "$f" "$UPLOAD_DIR/") ;;
              esac
            done
          fi
          echo "OSSI_DELIVERY_DIR=$DELIVERY_DIR" >> "$GITHUB_ENV"
          echo "OSSI_UPLOAD_DIR=$UPLOAD_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ossi_userdebug_${{ inputs.kernel_file }}_${{ inputs.ksu_variant }}
          path: ${{ env.OSSI_UPLOAD_DIR }}
          if-no-files-found: error
