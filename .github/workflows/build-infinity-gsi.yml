name: Build Project Infinity-X 3.12 Treble GSI (DSU arm64-ab)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant (user recommended for clean SELinux policy; userdebug for adb root)"
        type: choice
        required: true
        default: "user"
        options: ["user", "userdebug"]
      with_gapps:
        description: "Include GApps (WITH_GAPPS=true)"
        type: boolean
        default: false
      lineage_hide:
        description: "Apply yokeshiq custom-ROM / LineageOS anti-detection patches (Android 16)"
        type: boolean
        default: true
      sync_source:
        description: "Run scripts/rom-sync.sh --branch 16 before building"
        type: boolean
        default: false
      source_dir:
        description: "Android 16 checkout on the runner (default: ~/gt5-gsi/infinity-x-3.12)"
        required: false
        default: ""
      mirror_mode:
        description: "Source/download mirror mode (direct recommended when proxy/overseas is available)"
        type: choice
        required: true
        default: auto
        options: [auto, direct, cn]
      restore_cache_tag:
        description: "Optional GitHub Release tag to restore incremental out/gsi cache before building"
        required: false
        default: ""
      publish_release:
        description: "Upload verified GSI .img.gz to GitHub Release infinity-x-3.12-gsi-arm64-dsu"
        type: boolean
        default: false
      rom_runner:
        description: "Runner label for GSI build job"
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - gt5-rom
          - ubuntu-latest

permissions:
  actions: read
  contents: write

jobs:
  build-gsi:
    runs-on: ${{ fromJSON(inputs.rom_runner == 'gt5-rom' && '["self-hosted","linux","x64","gt5-rom"]' || (inputs.rom_runner == 'ubuntu-latest' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]')) }}
    concurrency:
      group: gt5-self-hosted-gsi-312
      cancel-in-progress: false
    timeout-minutes: 420
    steps:
      - name: Checkout repository (self-hosted multi-mirror)
        if: runner.environment != 'github-hosted'
        run: |
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          REPO_URL="https://github.com/${{ github.repository }}.git"
          OK=0
          for prefix in "" "https://cdn.gh-proxy.org/" "https://edgeone.gh-proxy.org/" "https://gh-proxy.org/" "https://v6.gh-proxy.org/" "https://gh-proxy.com/"; do
            echo "Trying checkout: ${prefix:-direct}${REPO_URL} @ ${{ github.sha }}"
            if GIT_TERMINAL_PROMPT=0 git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 clone --depth=1 --branch "${{ github.ref_name }}" "${prefix}${REPO_URL}" "$GITHUB_WORKSPACE" && \
               GIT_TERMINAL_PROMPT=0 git -C "$GITHUB_WORKSPACE" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=20 fetch --depth=1 "${prefix}${REPO_URL}" "${{ github.sha }}" && \
               git -C "$GITHUB_WORKSPACE" checkout -f FETCH_HEAD; then
              OK=1
              break
            fi
            rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          done
          [ "$OK" = 1 ] || exit 1
      - name: Checkout repository (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        run: |
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true
          git clone --depth=1 --branch "${{ github.ref_name }}" "https://github.com/${{ github.repository }}.git" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" checkout -f FETCH_HEAD
      - name: Configure mirror mode
        env:
          INPUT_MIRROR_MODE: ${{ inputs.mirror_mode }}
        run: |
          if [ "$INPUT_MIRROR_MODE" != "auto" ]; then
            echo "MIRROR_MODE=$INPUT_MIRROR_MODE" >> "$GITHUB_ENV"
          elif [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            echo "MIRROR_MODE=direct" >> "$GITHUB_ENV"
          else
            echo "MIRROR_MODE=cn" >> "$GITHUB_ENV"
          fi
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Sync Project Infinity-X 16 (3.12) source (optional)
        if: ${{ inputs.sync_source }}
        env:
          ROM_SOURCE: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail
          SRC="${ROM_SOURCE:-$HOME/gt5-gsi/infinity-x-3.12}"
          bash scripts/rom-sync.sh --dir "$SRC" --manifest https://github.com/ProjectInfinity-X/manifest --branch 16
      - name: Restore incremental GSI build cache (optional)
        if: ${{ inputs.restore_cache_tag != '' }}
        env:
          ROM_SOURCE: ${{ inputs.source_dir }}
          CACHE_TAG: ${{ inputs.restore_cache_tag }}
        run: |
          set -euo pipefail
          SRC="${ROM_SOURCE:-$HOME/gt5-gsi/infinity-x-3.12}"
          python3 scripts/rom-cache-sync.py restore --repo "$GITHUB_REPOSITORY" --tag "$CACHE_TAG" --src "$SRC"
      - name: Build and verify Project Infinity-X 3.12 Treble GSI
        env:
          ROM_SOURCE: ${{ inputs.source_dir }}
          VARIANT: ${{ inputs.variant }}
          WITH_GAPPS: ${{ inputs.with_gapps }}
          LINEAGE_HIDE: ${{ inputs.lineage_hide }}
        run: |
          set -euo pipefail
          SRC="${ROM_SOURCE:-$HOME/gt5-gsi/infinity-x-3.12}"
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ] && [ -w "$HOME" ]; then
            GSI_OUT="$HOME/gt5-gsi-deliveries/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            GSI_OUT="$RUNNER_TEMP/gt5-gsi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          rm -rf "$GSI_OUT"
          mkdir -p "$GSI_OUT"
          bash scripts/rom-build-gsi.sh \
            --src "$SRC" \
            --output "$GSI_OUT" \
            --variant "$VARIANT" \
            --gapps "$WITH_GAPPS" \
            --lineage-hide "$LINEAGE_HIDE"
          echo "GT5_GSI_OUT=$GSI_OUT" >> "$GITHUB_ENV"
      - name: Publish GSI Release (optional)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="infinity-x-3.12-gsi-arm64-dsu"
          GSI_OUT="${GT5_GSI_OUT:?}"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Project Infinity-X 3.12 (Android 16) Treble GSI arm64-ab (5.15.149 / DSU)" \
              --notes "Automated verified Project Infinity-X 3.12 (Android 16 / bp4a) Treble GSI for Realme GT5 (5.15.149 OGKI / RMX3820_15.0.0.320): ColorOS property_contexts & OPLUS Phoenix fixes, optical UDFPS Z-order, GT5 auto-brightness, yokeshiq anti-detection, and unified zh-rCN localization."
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "$GSI_OUT"/Infinity-X-3.12-gsi_arm64-*.img.gz \
            "$GSI_OUT/gsi-verify.txt" \
            "$GSI_OUT/SHA256SUMS.txt"
      - name: Publish GSI build summary
        run: |
          GSI_OUT="${GT5_GSI_OUT:?}"
          {
            echo "## Project Infinity-X 3.12 (Android 16) Treble GSI (DSU arm64-ab)"
            echo ""
            echo "- Delivery Directory: \`$GSI_OUT\`"
            echo ""
            echo "### SHA256SUMS.txt"
            echo '```text'
            cat "$GSI_OUT/SHA256SUMS.txt"
            echo '```'
            echo ""
            echo "### gsi-verify.txt"
            echo '```text'
            cat "$GSI_OUT/gsi-verify.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
